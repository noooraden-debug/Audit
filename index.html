<body>
<div class="app" id="app"></div>

<script>
/* ================= FIREBASE (Realtime DB only - NO Storage used) ================= */
const firebaseConfig={
  apiKey:"AIzaSyDq0rG5RjM4U6J4moCDyyRIyYfkdygyw40",
  authDomain:"track-accounts-and-invoices.firebaseapp.com",
  databaseURL:"https://track-accounts-and-invoices-default-rtdb.firebaseio.com",
  projectId:"track-accounts-and-invoices",
  storageBucket:"track-accounts-and-invoices.appspot.com",
  messagingSenderId:"5173557926",
  appId:"1:5173557926:web:cec722c13234731e7dd267"
};
firebase.initializeApp(firebaseConfig);
const DB=firebase.database();
const DEV_PHONE='963957869853';

/* ================= STATE ================= */
const State={
  user:null,page:'home',navStack:[],
  invoices:[],items:[],merchants:[],
  profile:{name:'',address:'',phone:'',logo:''},
  users:{admin:{pass:'admin123',name:'المدير العام'},admin1:{pass:'admin1234',name:'المستخدم الثاني'}},
  currentInvoice:null,listeners:{},
  _stockCache:null,_lowSeen:{}
};
const LS_KEY='inv_session_v7';
const NAV_KEY='inv_navstate_v1';
/* Persist where the user is in the app (current page, nav stack, in-progress invoice,
   which merchant a statement view is showing) so that leaving the app - e.g. tapping
   "share on WhatsApp", which backgrounds/sometimes reloads the WebView on Android - and
   coming back returns to the same screen instead of dropping back to the home page. */
function saveNavState(){
  try{
    localStorage.setItem(NAV_KEY,JSON.stringify({
      page:State.page,
      navStack:State.navStack,
      currentInvoice:State.currentInvoice,
      stmtM:State._stmtM||null,
      ts:Date.now()
    }));
  }catch(e){}
}
function restoreNavState(){
  try{
    const raw=localStorage.getItem(NAV_KEY);
    if(!raw)return false;
    const s=JSON.parse(raw);
    // Only restore fairly recent state (a few hours) so a stale/old session doesn't
    // unexpectedly resurface days later.
    if(!s||!s.ts||(Date.now()-s.ts)>6*60*60*1000)return false;
    if(!s.page||s.page==='home')return false;
    State.page=s.page;
    State.navStack=Array.isArray(s.navStack)?s.navStack:[];
    // Keep at most one in-app level on restore, so the browser-history mirror built by
    // _histRebase() after this stays consistent (one entry per in-app menu level).
    if(State.navStack.length>0)State.navStack=['home'];
    State.currentInvoice=s.currentInvoice||null;
    State._stmtM=s.stmtM||null;
    return true;
  }catch(e){return false}
}

/* ================= UTILS ================= */
let _toastT;
let _navSaveT=null;
/* Back-button engine state. Declared up here (NOT at the bottom where the logic lives)
   because the Firebase 'value' callbacks may fire _histRebase()/goTo() very early, and
   `let` variables would still be in their temporal dead zone if declared down there. */
let _exitArm=false,_exitT=null,_ignorePops=false,_suppressPop=false;
function toast(m,isErr){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(isErr?' err':'');clearTimeout(_toastT);_toastT=setTimeout(()=>t.className='toast',2500)}
function fmt(n){
  n=Number(n||0);if(!isFinite(n))n=0;
  const s=Math.abs(n).toFixed(2).replace(/\.00$/,'');
  const [a,b]=s.split('.');
  const af=a.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (n<0?'-':'')+(b?af+'.'+b:af);
}
function today(){return new Date().toISOString().slice(0,10)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nextNo(){return State.invoices.length?Math.max(...State.invoices.map(i=>+i.no||0))+1:1}
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
function closeAll(){document.querySelectorAll('.mbg,.cmenu').forEach(e=>e.remove())}
function compressImage(file,max=450,q=0.6){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=rej;
    r.onload=ev=>{
      const i=new Image();
      i.onerror=rej;
      i.onload=()=>{
        let w=i.width,h=i.height;
        if(w>h&&w>max){h=Math.round(h*max/w);w=max}
        else if(h>max){w=Math.round(w*max/h);h=max}
        const c=document.createElement('canvas');
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(i,0,0,w,h);
        setTimeout(()=>{try{res(c.toDataURL('image/jpeg',q))}catch(e){rej(e)}},30);
      };
      i.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}
function goTo(page){
  if(State.page===page)return;
  State.navStack.push(State.page);
  State.page=page;
  clearTimeout(_exitT);_exitArm=false;
  render();
  // Mirror every in-app forward navigation with one real browser-history entry.
  // This is what makes WebView.canGoBack() true inside the app, so the phone's
  // hardware back key is routed to history.back() (instead of killing the app)
  // on modern Android versions the same way it already worked on older ones.
  _pushHist();
}
/* Show a generated document (invoice/report/statement) as an in-page overlay instead of a
   new window/tab. Android WebView apps (webintoapp.com and similar) frequently cannot open
   window.open() popups at all, which is why PDF/print used to silently fail or hang.
   This overlay stays inside the same page/WebView, so:
   - the hardware back button keeps working normally (it just closes the overlay - handled
     by the existing back-button code, since .mbg is treated as a closeable modal)
   - "حفظ PDF" builds a REAL PDF file client-side (html2canvas renders the Arabic text
     correctly into an image, jsPDF embeds it into an actual .pdf) and downloads it, which
     the user can then open with any PDF app or print with their thermal/regular printer
   - "طباعة" triggers the normal browser print dialog scoped to just this content, for
     devices where WebView print works directly */

function printOverlayNow(){
  const content=document.getElementById('_printContent');
  if(!content){toast('لا يوجد محتوى للطباعة',true);return}
  const w=window.open('','_blank','width=800,height=600');
  if(w&&w.document){
    w.document.write(`<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
      body{font-family:Tahoma,Arial,sans-serif;padding:16px}
      table{width:100%;border-collapse:collapse;margin-top:10px}
      th,td{border:1px solid #333;padding:8px;text-align:center;font-size:13px}
      .hd{display:flex;justify-content:space-between;align-items:flex-start}
      .lg{max-width:100px;max-height:100px}
      h1,h2{text-align:center;color:#2e7d32}
      .sum div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #ddd}
      .bal{background:#c8e6c9;padding:8px;font-weight:bold;color:#1b5e20}
      </style></head><body>${content.innerHTML}</body></html>`);
    w.document.close();
    setTimeout(()=>{try{w.print()}catch(e){}},400);
  }else{
    // window.open blocked (common in WebView apps) - fall back to printing the current page,
    // temporarily hiding everything except the overlay content via a print-only stylesheet.
    const st=document.createElement('style');
    st.id='_printOnlyStyle';
    st.innerHTML=`@media print{ body *{visibility:hidden}
      #_printContent, #_printContent *{visibility:visible}
      #_printContent{position:absolute;left:0;top:0;width:100%}
      .pbar{display:none!important} }`;
    document.head.appendChild(st);
    window.print();
    setTimeout(()=>{const s=document.getElementById('_printOnlyStyle');if(s)s.remove()},1000);
  }
}
function savePdfNow(filename){
  const content=document.getElementById('_printContent');
  if(!content){toast('لا يوجد محتوى للحفظ',true);return}
  if(typeof html2canvas==='undefined'||typeof window.jspdf==='undefined'){
    toast('تعذر تحميل مكتبة PDF، تحقق من الاتصال بالانترنت',true);
    return;
  }
  toast('جاري إنشاء ملف PDF...');
  html2canvas(content,{scale:2,useCORS:true,backgroundColor:'#ffffff'}).then(canvas=>{
    const {jsPDF}=window.jspdf;
    const imgW=canvas.width,imgH=canvas.height;
    const pdfW=595.28; // A4 width in pt
    const pdfH=imgH*(pdfW/imgW);
    const doc=new jsPDF({orientation:'portrait',unit:'pt',format:[pdfW,Math.max(pdfH,841.89)]});
    doc.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,pdfW,pdfH);
    const safeName=(filename||'مستند').replace(/[\\\/:*?"<>|]/g,'-');
    const blob=doc.output('blob');
    const url=URL.createObjectURL(blob);
    // Trigger a real file download. Android WebViews handle <a download> far more
    // reliably than window.open() - the file lands in Downloads and can be opened
    // with any PDF viewer or shared directly to a printing app from there.
    const a=document.createElement('a');
    a.href=url;a.download=safeName+'.pdf';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    toast('تم حفظ الملف: '+safeName+'.pdf');
  }).catch(err=>{
    console.error(err);
    toast('حدث خطأ اثناء انشاء PDF',true);
  });
}
/* One logical back step INSIDE the app (pop one menu). Never call history.back() from

/* ================= SYNC ================= */
let _dataReady=false;
function loadData(){
  let loaded={invoices:false,items:false,merchants:false,profile:false,users:!!State.listeners.users};
  const keys=['invoices','items','merchants','profile','users'];
  keys.forEach(k=>{
    if(State.listeners[k])return;
    DB.ref(k).on('value',snap=>{
      const v=snap.val();
      if(v===null){
        if(k==='invoices')State.invoices=[];
        else if(k==='items')State.items=[];
        else if(k==='merchants')State.merchants=[];
        else if(k==='profile')State.profile={name:'',address:'',phone:'',logo:''};
        else if(k==='users')State.users={admin:{pass:'admin123',name:'المدير العام'},admin1:{pass:'admin1234',name:'المستخدم الثاني'}};
      }else{
        if(k==='invoices')State.invoices=Object.entries(v).map(([id,o])=>({id,...o}));
        else if(k==='items')State.items=Object.entries(v).map(([id,o])=>({id,...o}));
        else if(k==='merchants')State.merchants=Object.entries(v).map(([id,o])=>({id,...o}));
        else if(k==='profile')State.profile=v;
        else if(k==='users')State.users=v;
      }
      State._stockCache=null;
      loaded[k]=true;
      if(keys.every(x=>loaded[x])){_dataReady=true}
      if(State.user)render();
    },err=>{
      console.error(err);loaded[k]=true;
    });
    State.listeners[k]=1;
  });
}

/* ================= STOCK ================= */
function recalcStock(){
  if(State._stockCache)return State._stockCache;
  const stock={};
  State.items.forEach(it=>{stock[(it.name||'').toLowerCase()]=+(it.openingStock||0)});
  State.invoices.forEach(inv=>{
    if(inv.isPayment)return;
    (inv.items||[]).forEach(it=>{
      const k=(it.name||'').toLowerCase();if(!k)return;
      if(!(k in stock))stock[k]=0;
      let q=Math.abs(+it.qty||0);
      // Returns flip direction
      const dir=inv.isReturn?-1:1;
      if(inv.type==='مورد')stock[k]+=dir*q;
      else stock[k]-=dir*q;
    });
  });
  State._stockCache=stock;
  return stock;
}
function stockOf(name){const s=recalcStock();return s[(name||'').toLowerCase()]||0}
function lowStockItems(){
  const stock=recalcStock();
  return State.items.filter(it=>{
    const s=stock[(it.name||'').toLowerCase()]||0;
    const mn=+(it.minStock||0);
    return mn>0&&s<=mn;
  });
}

/* ================= PRICE HISTORY ================= */
function priceHist(name){
  const lc=(name||'').toLowerCase();
  const lines=[];
  State.invoices.forEach(inv=>(inv.items||[]).forEach(it=>{
    if(it.name&&it.name.toLowerCase()===lc&&+it.price>0)
      lines.push({price:+it.price,date:inv.date,no:inv.no,merchant:inv.merchant,qty:+it.qty||0,type:inv.type});
  }));
  return lines.sort((a,b)=>a.price-b.price);
}
function bestDeal(name){
  // best (lowest) purchase price from supplier
  const ph=priceHist(name).filter(l=>l.type==='مورد'||!l.type);
  return ph.length?ph[0]:null;
}

function hdrMenu(e,page){
  e.stopPropagation();e.preventDefault();closeAll();
  const items=page==='home'?[
    ['💾 حفظ نسخة احتياطية','backupData()'],
    ['📂 استرجاع نسخة','restoreData()'],
    ['📤 ارسال نسخة للواتس','shareBackup()'],
    ['📞 تواصل مع المطور',`window.open('tel:+${DEV_PHONE}')`],
    ['↩️ فاتورة مرتجعات','newReturn()'],
    ['🔔 مسح اشعارات التنبيه','clearAlerts()'],
    ['🚪 تسجيل الخروج','logout()']
  ]:page==='newInv'?[
    ['📱 مشاركة واتساب','shareWA()'],
    ['🖨 طباعة / PDF','invPDF()'],
    ['📂 استيراد من فاتورة','importInv()'],
    ['📋 كشف حساب التاجر','stmtCurrent()']
  ]:[
    ['🏠 الرئيسية',"goHome()"],
    ['📞 تواصل مع المطور',`window.open('tel:+${DEV_PHONE}')`]
  ];
  // Each item closes ONLY the dropdown menu itself (not any modal/overlay the action opens),
  // then runs its action. Previously this called the global closeAll() which also wiped out
  // any .mbg overlay the action had just created (e.g. invPDF()'s preview, importInv()'s list),
  // because the same click event bubbled to a document-level listener that ran closeAll() again
  // microseconds later, deleting the just-opened result before it could ever be seen.
  const m=el('<div class="cmenu">'+items.map(([t,fn])=>`<div ontouchstart="event.stopPropagation()" onclick="event.stopPropagation();closeMenuOnly();${fn}">${t}</div>`).join('')+'</div>');
  document.body.appendChild(m);
  const r=e.currentTarget.getBoundingClientRect();
  m.style.top=Math.min(r.bottom+6,window.innerHeight-m.offsetHeight-10)+'px';
  m.style.right='10px';
  setTimeout(()=>document.addEventListener('click',closeMenuOnly,{once:true}),30);
}

function restoreData(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);const o={};
      if(d.invoices)o.invoices=Object.fromEntries(d.invoices.map(x=>[x.id||uid(),x]));
      if(d.items)o.items=Object.fromEntries(d.items.map(x=>[x.id||uid(),x]));
      if(d.merchants)o.merchants=Object.fromEntries(d.merchants.map(x=>[x.id||uid(),x]));
      if(d.profile)o.profile=d.profile;
      if(d.users)o.users=d.users;
      DB.ref().update(o,()=>{toast('تم الاسترجاع');State._stockCache=null});
    }catch(e){toast('ملف غير صالح',true)}};r.readAsText(f)};i.click();
}

/* merchant autocomplete - position using left (safe, no overflow off screen right) */
function posAc(list,inp){
  if(!list||!inp)return;
  const r=inp.getBoundingClientRect();
  const margin=8;
  let w=Math.max(r.width,240);
  // constrain to screen width
  w=Math.min(w,window.innerWidth-2*margin);
  list.style.width=w+'px';
  // Place left edge aligned with input left edge, but if that overflows right, pull left
  let left=r.left;
  if(left+w>window.innerWidth-margin)left=window.innerWidth-margin-w;
  if(left<margin)left=margin;
  list.style.left=left+'px';
  list.style.right='auto';
  const sb=window.innerHeight-r.bottom,need=260;
  if(sb<need&&r.top>need+40){
    // flip up
    list.style.top='auto';list.style.bottom=(window.innerHeight-r.top+4)+'px';
    list.style.maxHeight=Math.min(280,r.top-20)+'px';
  }else{
    list.style.top=(r.bottom+4)+'px';list.style.bottom='auto';
    list.style.maxHeight=Math.min(320,Math.max(140,sb-10))+'px';
  }
}
function merchantAc(inp){

  const invN=[...new Set(State.invoices.map(i=>i.merchant).filter(n=>n&&n.toLowerCase().includes(q)))];
  let html=fromM.slice(0,8).map(m=>`<div class="aci" ontouchstart="event.stopPropagation()" onclick="pickM('${esc(m.name)}')">
    <span class="aci-name">${m.name}${(m.whatsapp||m.phone)?' 📱':''}<br><span class="aci-info">${m.type} — رصيد: ${fmt(Math.abs(m.balance||0))} ${(m.balance||0)>0?'(علينا)':'(لنا)'}</span></span></div>`).join('');
  const extra=invN.filter(n=>!fromM.find(x=>x.name===n)).slice(0,4);

function itemAc(inp,idx){
  const q=inp.value.trim().toLowerCase(),list=document.getElementById('ac_i_'+idx);if(!list)return;
  const stock=recalcStock();
  if(!q){
    // when empty, show visual search hint + recent items
    const recent=[...State.items].sort((a,b)=>{const la=State.invoices.filter(i=>(i.items||[]).some(x=>x.name===a.name)).length;
      const lb=State.invoices.filter(i=>(i.items||[]).some(x=>x.name===b.name)).length;return lb-la;}).slice(0,6);

    list.innerHTML=recent.map(it=>renderAci(it,idx,stock)).join('');
    list.style.display='block';posAc(list,inp);document.getElementById('ph_'+idx).innerHTML='';return;
  }
  const cat=State.items.filter(it=>(it.name||'').toLowerCase().includes(q));
  const hn=[...new Set(State.invoices.flatMap(i=>i.items||[]).filter(it=>it.name&&it.name.toLowerCase().includes(q)).map(it=>it.name))].filter(n=>!cat.find(c=>c.name.toLowerCase()===n.toLowerCase()));
  let html=cat.slice(0,10).map(it=>renderAci(it,idx,stock)).join('');
  html+=hn.slice(0,4).map(n=>{const ph=priceHist(n);const mn=ph.length?ph[0].price:0;
    return `<div class="aci" ontouchstart="event.stopPropagation()" onclick="pickI(${idx},'${esc(n)}','${mn}','')"><span class="aci-name">${n} <span class="chip">سجل</span><br><span class="aci-info">اقل سعر: <b style="color:#c62828">${fmt(mn)}</b></span></span></div>`}).join('');

async function takeRowImg(i){
  // Ask: search existing or attach new?
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    toast('جاري المعالجة...');
    try{
      const d=await compressImage(f,300,0.6);
      // First do visual search
      const th=await cHist(d);
      let matches=[];
      for(const it of State.items){
        if(!it.image)continue;
        try{const h=await cHist(it.image);const s=hInt(th,h);if(s>0.1)matches.push({it,s})}catch(e){}
      }
      matches.sort((a,b)=>b.s-a.s);matches=matches.slice(0,8);
      if(matches.length&&matches[0].s>0.25){
        // Auto-pick best match, attach image
        const best=matches[0].it;
        toast('تم التعرف على: '+best.name+' ('+Math.round(matches[0].s*100)+'%)');
        State.currentInvoice.items[i].name=best.name;
        State.currentInvoice.items[i].price=+best.price||0;
        State.currentInvoice.items[i].image=d;
        renderInvRows();showHist(i,best.name);
        return;
      }
      // No good match - attach as new image for this row
      const big=await compressImage(f,450,0.65);
      State.currentInvoice.items[i].image=big;
      renderInvRows();
      toast('تم ارفاق الصورة');
    }catch(err){toast('خطأ في الصورة',true)}
  };
  inp.click();
}

function recalc(){
  const w=State.currentInvoice;if(!w)return;
  w.total=w.items.reduce((s,it)=>s+(+it.qty||0)*(+it.price||0),0);
  w.netTotal=w.total;
  const isMaw=w.type.startsWith('مورد');
  const m=State.merchants.find(x=>x.name===w.merchant);
  w.prevBalance=m?(+m.balance||0):0;
  w.balance=w.prevBalance+(isMaw?w.netTotal:-w.netTotal)-(+w.paid||0);
  const a=id=>document.getElementById(id);
  if(a('t_tot'))a('t_tot').textContent=fmt(w.total);
  if(a('t_net'))a('t_net').textContent=fmt(w.netTotal);
  if(a('t_prev'))a('t_prev').textContent=fmt(w.prevBalance);
  if(a('t_bal'))a('t_bal').textContent=fmt(Math.abs(w.balance));
  clearTimeout(_navSaveT);_navSaveT=setTimeout(saveNavState,400);
}

function saveInv(){
  const w=State.currentInvoice;
  const merchInput=document.getElementById('inv_m');
  if(merchInput)w.merchant=merchInput.value.trim();
  const waInp=document.getElementById('inv_wa');if(waInp)w._wa=waInp.value.trim();
  if(!w.merchant){window._afterSaveExit=false;toast('اكتب اسم التاجر',true);return}
  if(!w.items.length){window._afterSaveExit=false;toast('اضف صنفاً واحداً على الاقل',true);return}
  w.items.forEach(it=>{it.qty=Math.abs(+it.qty||0);if(!it.total)it.total=it.qty*(+it.price||0)});
  recalc();
  w.type=w.type.startsWith('مورد')?'مورد':'عميل';
  if(!('isReturn' in w))w.isReturn=0;
  w.createdBy=State.user;w.createdAt=Date.now();
  toast('جاري الحفظ...');
  const tasks=[];
  let m=State.merchants.find(x=>x.name===w.merchant);
  if(!m){const mid=pushFB('merchants',{});m={id:mid,name:w.merchant,type:w.type,phone:'',whatsapp:w._wa||'',balance:0};tasks.push(saveFB('merchants/'+mid,m))}
  else{
    tasks.push(saveFB('merchants/'+m.id+'/type',w.type));
    // Persist the WhatsApp number typed on the invoice into the merchant's card so it
    // shows up automatically on the next invoice. This also gives OLD merchants (saved
    // before, without any number) their number without opening the edit screen.
    if(w._wa&&w._wa!==(m.whatsapp||''))tasks.push(updFB('merchants/'+m.id+'/whatsapp',w._wa));
  }
  let id;
  if(w.id){id=w.id;tasks.push(saveFB('invoices/'+id,w))}
  else{id=pushFB('invoices',{});w.id=id;w.no=nextNo();tasks.push(saveFB('invoices/'+id,w))}
  w.items.forEach(it=>{
    if(!it.name)return;
    const ex=State.items.find(x=>x.name.toLowerCase()===it.name.toLowerCase());
    const data={name:it.name,price:+it.price||0};if(it.image)data.image=it.image;
    if(!ex){const iid=pushFB('items',{});data.id=iid;data.openingStock=0;data.minStock=0;data.createdAt=Date.now();tasks.push(saveFB('items/'+iid,data))}
    else{if(!ex.minStock)data.minStock=0;tasks.push(updFB('items/'+ex.id,data))}
  });
  Promise.all(tasks).then(()=>{
    recalcMbal(w.merchant,w);
    State._stockCache=null;
    toast('✅ تم حفظ الفاتورة رقم '+w.no);
    // "حفظ ثم خروج" came from the unsaved-changes dialog: leave the screen after saving,
    // and move the WebView history back with a silent back so the phone key stays in sync.
    if(window._afterSaveExit){
      window._afterSaveExit=false;
      State.currentInvoice=null;
      _stepBack();
      _silentBack();
      return;
    }
    State.currentInvoice={id:null,no:null,date:today(),type:'مورد (شراء)',merchant:'',payment:'آجل',paid:0,items:[],total:0,netTotal:0,balance:0,prevBalance:0,note:'',isReturn:0};
    setTimeout(()=>{State.currentInvoice.no=nextNo();render()},400);
  }).catch(e=>{window._afterSaveExit=false;toast('خطأ: '+e.message,true)});
}
function recalcMbal(name,extra){
  let invs=State.invoices.filter(i=>i.merchant===name&&i.id!==(extra&&extra.id));
  if(extra&&extra.id)invs.push(extra);
  let bal=0;
  invs.forEach(i=>{
    if(i.isPayment){bal-=(i.paid||0);return}
    const s=i.type==='مورد'?1:-1;
    const dir=i.isReturn?-1:1;
    bal+=dir*s*(i.netTotal||0);
    bal-=(i.paid||0);
  });
  const m=State.merchants.find(x=>x.name===name);
  if(m)saveFB('merchants/'+m.id+'/balance',bal);
}

function delCurrentInv(){
  const w=State.currentInvoice;
  if(!w||!w.id)return;
  if(!confirm('حذف الفاتورة رقم '+w.no+'؟ سيتم تعديل المخزون ورصيد التاجر تلقائياً'))return;
  toast('جاري الحذف...');
  // After delete, stock & merchant balance will recalculate because listeners fire
  delFB('invoices/'+w.id).then(()=>{
    // recalculate merchant balance from scratch (easiest/safest)
    const m=State.merchants.find(x=>x.name===w.merchant);
    if(m)recalcMbal(w.merchant);
    State._stockCache=null;
    toast('تم حذف الفاتورة');
    State.currentInvoice=null;
    goBack();
  }).catch(e=>toast('خطأ: '+e.message,true));
}

async function searchInvByImg(e){
  const f=e.target.files[0];if(!f)return;toast('جاري البحث...');
  try{
    const d=await compressImage(f,300,0.6);const th=await cHist(d);
    let best=null,bs=0;
    for(const it of State.items){if(!it.image)continue;try{const h=await cHist(it.image);const s=hInt(th,h);if(s>bs){bs=s;best=it}}catch(e){}}
    if(best&&bs>0.05){document.getElementById('sf_item').value=best.name;runSearchInv();toast('تم التعرف: '+best.name+' ('+Math.round(bs*100)+'%)')}
    else toast('لا يوجد تطابق',true);
  }catch(err){toast('خطأ في البحث',true)}
  e.target.value='';
}
function iHist(d){const h=new Float32Array(64);for(let i=0;i<d.length;i+=4){const r=d[i]>>6,g=d[i+1]>>6,b=d[i+2]>>6;h[r*16+g*4+b]++}const t=d.length/4;for(let i=0;i<h.length;i++)h[i]/=t;return h}
function cHist(u){return new Promise(res=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>{const c=document.createElement('canvas');c.width=24;c.height=24;const x=c.getContext('2d');x.drawImage(i,0,0,24,24);try{res(iHist(x.getImageData(0,0,24,24).data))}catch(e){res(new Float32Array(64))}};i.onerror=()=>res(new Float32Array(64));i.src=u})}
function hInt(a,b){let s=0;for(let i=0;i<a.length;i++)s+=Math.min(a[i],b[i]);return s}

function showItemDet(id,name){

function stmtMerchant(id,mode){

function buildStatement(m){
  const invs=State.invoices.filter(i=>i.merchant===m.name).sort((a,b)=>a.date.localeCompare(b.date)||((a.no||0)-(b.no||0)));
  let bal=0;const rows=[];
  invs.forEach(i=>{
    if(i.isPayment){
      bal-=(i.paid||0);
      rows.push({no:i.no,date:i.date,desc:'💵 دفعة: '+(i.note||''),debit:0,credit:i.paid||0,bal});
    }else{
      const dir=i.isReturn?-1:1;
      const s=i.type==='مورد'?1:-1;
      const amt=dir*s*(i.netTotal||0);
      const paid=i.paid||0;
      // Apply invoice effect: supplier invoice adds to balance (we owe), customer invoice subtracts (they owe)
      bal+=amt;
      const itemsTxt=(i.items||[]).map(x=>x.name+(x.qty&&x.qty!=1?' ('+fmt(x.qty)+')':'')).join('، ');
      const desc=(i.isReturn?'🔄 ':'')+(i.type==='مورد'?'📥 شراء':'📤 بيع')+(itemsTxt?': '+itemsTxt:' - '+(i.items||[]).length+' صنف');
      // For invoice: show net as the movement, then separately record payment reducing our owed
      rows.push({no:i.no,date:i.date,desc,debit:amt>0?amt:0,credit:amt<0?-amt:0,bal});
      if(paid){
        bal-=paid;
        rows.push({no:'',date:i.date,desc:'💵 مدفوع: '+(i.note||''),debit:0,credit:paid,bal});
      }
    }
  });
  return rows;
}

  <tr class="bal"><td colspan="5" style="font-weight:bold">الرصيد النهائي</td><td style="font-weight:bold">${fmt(rows.length?rows[rows.length-1].bal:m.balance||0)}</td></tr>
  </tbody></table>`;
  openPrintable('كشف حساب '+m.name,body,'كشف حساب - '+m.name);
}

  closeAll();

📅 ${today()}
━━━━━━━━━━━━━━━\n`;
  rows.slice(-30).forEach(r=>{

  });

  if(!m){el.innerHTML='<div class="empty"><div class="big">🔍</div>لا يوجد تاجر بهذا الاسم</div>';return}
  const rows=buildStatement(m);

function itemsView(){

      <div class="field" style="flex:1"><label>&nbsp;</label><label class="btn btn-blue" style="display:flex;align-items:center;justify-content:center;height:44px;margin:0;padding:0">📷<input type="file" accept="image/*" onchange="searchItemImg(event)" style="display:none"></label></div>
    </div>

    <div id="it_stock"></div>
    <div class="pgrid" id="it_grid"></div>
  </div>`;
  setTimeout(renderItems,50);
  return h;

function renderItems(){
  const q=(document.getElementById('it_q')?.value||'').trim().toLowerCase();
  let list=State.items.slice();
  if(q)list=list.filter(i=>(i.name||'').toLowerCase().includes(q));
  list.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
  const stock=recalcStock();
  let totVal=0,lowCount=0,zeroCount=0;
  list.forEach(it=>{
    const s=stock[(it.name||'').toLowerCase()]||0;
    totVal+=s*(it.price||0);
    if(s<0||s==0)zeroCount++;
    if(+(it.minStock||0)>0&&s<=+(it.minStock||0))lowCount++;
  });
  const s=document.getElementById('it_stock');if(s)s.innerHTML=`<div class="stat-grid">
    <div class="stat-card"><div class="sn">عدد الاصناف</div><div class="sv">${list.length}</div></div>
    <div class="stat-card"><div class="sn">قيمة المخزون</div><div class="sv">${fmt(totVal)}</div></div>
    <div class="stat-card ${zeroCount?'red':''}"><div class="sn">اصناف ناقصة/نافدة</div><div class="sv">${zeroCount}</div></div>
    <div class="stat-card ${lowCount?'red':''}"><div class="sn">تحت الحد الادنى</div><div class="sv">${lowCount}</div></div>
  </div>`;
  const g=document.getElementById('it_grid');if(!g)return;
  if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="big">📦</div>لا توجد اصناف — اضف اول صنف او انشئ فاتورة</div>';return}
  g.innerHTML=list.map(it=>{const st=stock[(it.name||'').toLowerCase()]||0;const mn=+(it.minStock||0);
    const cls=st<0||st===0?'low':(mn>0&&st<=mn?'zero':'');
    const ph=priceHist(it.name);const b=ph.length?ph[0].price:0;
    return `<div class="pcard" onclick="editItem('${it.id}')">
      ${it.image?`<img src="${it.image}"/>`:`<div class="ph">📦</div>`}
      <div class="pn">${it.name}</div><div class="pp">السعر: ${fmt(it.price)}${b?` • اقل: ${fmt(b)}`:''}</div>
      <div class="pst ${cls}">المخزون: ${fmt(st)}${mn?` / ${fmt(mn)}`:''}</div>
    </div>`}).join('');
}
async function searchItemImg(e){
  const f=e.target.files[0];if(!f)return;toast('جاري البحث...');
  try{
    const d=await compressImage(f,300,0.6);const th=await cHist(d);
    const sc=[];for(const it of State.items){if(!it.image)continue;try{sc.push({it,s:hInt(th,await cHist(it.image))})}catch(e){}}
    sc.sort((a,b)=>b.s-a.s);const top=sc.filter(r=>r.s>0.05).slice(0,30);
    document.getElementById('it_q').value='';
    const g=document.getElementById('it_grid');
    if(!top.length){renderItems();toast('لا يوجد تطابق',true);e.target.value='';return}
    const stock=recalcStock();
    g.innerHTML=top.map(r=>{const st=stock[(r.it.name||'').toLowerCase()]||0;
      return `<div class="pcard" onclick="editItem('${r.it.id}')"><img src="${r.it.image}"><div class="pn">${r.it.name}</div><div class="pp">${fmt(r.it.price)} — ${Math.round(r.s*100)}%</div><div class="pst">مخزون: ${fmt(st)}</div></div>`}).join('');
    toast('تم عرض النتائج');
  }catch(err){toast('خطأ',true)}
  e.target.value='';
}

function renderBal(){
  const t=document.getElementById('b_type')?.value||State._flt||'',q=(document.getElementById('b_q')?.value||'').trim();
  if(State._flt){const s=document.getElementById('b_type');if(s)s.value=t;State._flt=null}
  let list=State.merchants.filter(m=>(+m.balance||0)!==0);if(t){if(t==='cust')list=list.filter(m=>m.type==='عميل');else if(t==='sup')list=list.filter(m=>m.type==='مورد');else list=list.filter(m=>m.type===t)}
  if(q)list=list.filter(m=>m.name.includes(q));
  list.sort((a,b)=>Math.abs(b.balance||0)-Math.abs(a.balance||0));
  const el=document.getElementById('b_list');if(!el)return;
  if(!list.length){el.innerHTML='<div class="empty"><div class="big">💰</div>لا يوجد ديون حالياً</div>'}
  else el.innerHTML=`<table><thead><tr><th>الحساب</th><th>الاسم</th><th>النوع</th><th>اجراء</th></tr></thead><tbody>
    ${list.map(m=>{const owe=(m.type==='مورد'&&(m.balance||0)>0)||(m.type==='عميل'&&(m.balance||0)<0);
      return `<tr><td style="color:${owe?'#c62828':'#2e7d32'};font-weight:bold" class="v">${fmt(Math.abs(m.balance||0))}</td><td>${m.name}</td><td>${m.type}</td><td><button class="btn btn-green" style="padding:6px 8px;font-size:12px" onclick="payM('${m.id}','تحصيل')">دفع</button></td></tr>`}).join('')}
  </tbody></table>`;
  const cust=State.merchants.filter(m=>m.type==='عميل').reduce((s,m)=>s+Math.max(0,-(+m.balance||0)),0);
  const sup=State.merchants.filter(m=>m.type==='مورد').reduce((s,m)=>s+Math.max(0,+(+m.balance||0)),0);
  const sum=document.getElementById('b_sum');if(sum)sum.innerHTML=`<table><tr><td class="v" style="color:#2e7d32;font-weight:bold">${fmt(cust)}</td><td>لنا عند العملاء</td></tr><tr><td class="v" style="color:#c62828;font-weight:bold">${fmt(sup)}</td><td>علينا للموردين</td></tr><tr><td class="v" style="font-weight:bold">${fmt(sup-cust)}</td><td>الصافي</td></tr></table>`;
}

function runRep(){
  const t=document.getElementById('rp_t').value,f=document.getElementById('rp_f').value,to=document.getElementById('rp_t2').value;
  const ty=t==='مبيعات'?'عميل':'مورد';
  const invs=State.invoices.filter(i=>i.type===ty&&!i.isPayment&&!i.isReturn&&i.date>=f&&i.date<=to);
  const it={};invs.forEach(i=>(i.items||[]).forEach(x=>{if(!it[x.name])it[x.name]={name:x.name,qty:0,total:0,price:x.price};const q=+x.qty||0,p=+x.price||0;it[x.name].qty+=q;it[x.name].total+=q*p}));
  const arr=Object.values(it).sort((a,b)=>b.total-a.total);
  const tot=arr.reduce((s,x)=>s+x.total,0),pd=invs.reduce((s,i)=>s+(+i.paid||0),0);
  document.getElementById('rp_o').innerHTML=`<div class="card"><table><thead><tr><th>اجمالي</th><th>سعر</th><th>كمية</th><th>الصنف</th><th>م</th></tr></thead><tbody>${arr.map((x,i)=>`<tr style="cursor:pointer" onclick="rpItemDet('${esc(x.name)}')"><td class="v">${fmt(x.total)}</td><td class="v">${fmt(x.price)}</td><td class="v">${fmt(x.qty)}</td><td>${x.name} 🔍</td><td>${i+1}</td></tr>`).join('')}</tbody></table>
  <table><tbody><tr><td class="v">${fmt(tot)}</td><td>اجمالي الفواتير</td></tr><tr><td class="v">${invs.length}</td><td>عدد الفواتير</td></tr><tr><td class="v">${fmt(pd)}</td><td>المدفوع</td></tr><tr><td class="v">${fmt(tot-pd)}</td><td>الآجل</td></tr></tbody></table><div id="rp_det" style="margin-top:10px"></div></div>`;
}
function rpItemDet(name){
  // Show item details within reports page
  const it=State.items.find(x=>x.name===name)||{name,price:0,image:''};
  const invs=State.invoices.filter(i=>!i.isPayment&&(i.items||[]).some(x=>x.name===name)).sort((a,b)=>b.date.localeCompare(a.date));
  const lines=[];
  invs.forEach(i=>(i.items||[]).filter(x=>x.name===name).forEach(x=>lines.push({...x,date:i.date,no:i.no,merchant:i.merchant,type:i.type,isReturn:i.isReturn})));
  const pr=lines.map(l=>+l.price).filter(p=>p>0).sort((a,b)=>a-b);
  const mn=pr[0]||0,mx=pr[pr.length-1]||0,avg=pr.length?pr.reduce((a,b)=>a+b,0)/pr.length:0;
  const best=bestDeal(name),st=stockOf(name);
  document.getElementById('rp_det').innerHTML=`<div class="card" style="border-color:#1565c0">
    <h4 style="color:#1565c0;margin-bottom:8px">🔍 تفاصيل الصنف: <b>${name}</b></h4>
    ${it.image?`<img src="${it.image}" style="max-width:120px;max-height:120px;border-radius:8px;display:block;margin:8px auto">`:''}
    <div class="hist-box">السعر الحالي: <b>${fmt(it.price)}</b> | اقل <b>${fmt(mn)}</b> — اعلى <b>${fmt(mx)}</b> — متوسط <b>${fmt(avg)}</b> | مخزون: <b>${fmt(st)}</b></div>
    ${best?`<div class="best-row">🏆 افضل سعر: <b>${fmt(best.price)}</b> من ${best.merchant} بتاريخ ${best.date}</div>`:''}
    <h5 style="margin:8px 0 4px;color:#2e7d32">الحركات (${lines.length}):</h5>
    <div style="max-height:250px;overflow-y:auto"><table style="font-size:12px"><thead><tr><th>#</th><th>تاريخ</th><th>تاجر</th><th>نوع</th><th>كمية</th><th>سعر</th></tr></thead><tbody>
    ${lines.slice(0,50).map(l=>{const ii=State.invoices.find(i=>i.no===l.no&&i.merchant===l.merchant);return `<tr style="cursor:pointer" onclick="closeRep();openInv('${ii?ii.id:''}')"><td>${l.no}</td><td>${l.date}</td><td>${l.merchant}</td><td>${l.isReturn?'🔄':''}${l.type}</td><td>${fmt(l.qty)}</td><td>${fmt(l.price)}</td></tr>`}).join('')}
    </tbody></table></div>
    <button class="btn btn-red" style="width:100%;margin-top:8px" onclick="document.getElementById('rp_det').innerHTML=''">اغلاق</button>
  </div>`;
}

/* ================= ANDROID BACK BUTTON — يعمل مثل سهم الرجوع داخل التطبيق ===========
   How this makes the PHONE's back key work on ALL Android versions (old Huawei Y9 and
   brand-new devices alike), inside a webintoapp.com-style WebView wrapper:
   - Every in-app forward navigation (goTo) pushes ONE real entry into the WebView's
     history (see _pushHist call there). So WebView.canGoBack() is true whenever the
     user is inside a menu, and the wrapper routes the hardware back key to
     history.back() instead of finishing (closing) the app.
   - Every pop of that history fires 'popstate', and _backStep(true) then decides what
     "back" means — the exact same logic the in-app arrow uses:
       1) an open dialog/menu        -> close it (history depth is repaired)
       2) an open suggestions list   -> hide it (history depth is repaired)
       3) invoice with UNSAVED edits -> a proper dialog: حفظ ثم خروج / خروج بدون حفظ /
                                        متابعة التحرير  (NO native confirm(), which
                                        many new WebViews silently block when the back
                                        press didn't come with "user activation")

       5) on the home screen         -> "اضغط رجوع مرة اخرى للخروج" (two presses/2s)

   would otherwise disagree (THE reason the back key exited the app on newer devices:
   the history ran dry and the wrapper finished the activity). */

  setTimeout(()=>{
    try{history.replaceState({appNav:0},'')}catch(e){}
    for(let i=0;i<1+lvl;i++)_pushHist();

}
function goHome(){State.navStack=[];State.currentInvoice=null;State.page='home';clearTimeout(_exitT);_exitArm=false;render();_histRebase(0)}

function _invSnap(w){return JSON.stringify({t:w.type,d:w.date,m:w.merchant,p:w.payment,pd:+w.paid||0,n:w.note||'',r:w.isReturn||0,i:(w.items||[]).map(x=>[(x.name||''),+x.qty||0,+x.price||0])})}

/* The unsaved-changes dialog keeps the WebView history depth EXACTLY consistent:
   showing it always (re)stores the entry a hardware back press may have consumed, and
