<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#c8e6c9,#e8f5e9);color:#000;font-size:15px;overflow-x:hidden}

.welcome{padding:10px 14px;text-align:center;color:#1b5e20;background:#e8f5e9;font-size:14px;margin-bottom:8px}

table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08)}

.pcard .ph{width:100%;height:110px;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#558b2f;font-size:40px;margin-bottom:4px}

.pcard .pp{color:#2e7d32;font-size:13px;margin-top:2px;direction:ltr;unicode-bidi:embed}
.pcard .pst{font-size:12px;color:#558b2f;margin-top:2px}
.pcard .pst.low{color:#c62828;font-weight:bold}
.mcard{background:#fff;border:2px solid #81c784;border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer;box-shadow:0 2px 6px rgba(46,125,50,.12);display:flex;justify-content:space-between;align-items:center}
.mcard:active{background:#f1f8e9}
.mcard .mn{font-weight:bold;font-size:16px;color:#1b5e20}
.mcard .mt{font-size:12px;color:#666}
.mcard .mb{font-weight:bold;font-size:16px;direction:ltr;unicode-bidi:embed}
.mb.owe{color:#c62828}.mb.has{color:#2e7d32}
.cmenu{position:fixed;background:#fff;border:2px solid #43a047;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:1000;min-width:230px}
.cmenu div{padding:12px 16px;cursor:pointer;border-bottom:1px solid #e8f5e9;font-size:16px;text-align:right}
.cmenu div:last-child{border:0}
.cmenu div:active{background:#e8f5e9}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow-y:auto}
.mdl{background:#f1f8e9;border:3px solid #43a047;border-radius:14px;padding:16px;width:100%;max-width:520px;margin-bottom:40px}

.big-img{max-width:100%;max-height:45vh;border-radius:10px;display:block;margin:8px auto;border:3px solid #81c784}
.chip{display:inline-block;padding:2px 8px;background:#e8f5e9;border:1px solid #81c784;border-radius:12px;font-size:12px;margin:2px}
.chip.red{background:#ffebee;border-color:#ef5350;color:#c62828}
.chip.blue{background:#e3f2fd;border-color:#42a5f5;color:#1565c0}
.logo-preview{width:140px;height:140px;margin:10px auto;border:2px dashed #66bb6a;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;cursor:pointer}
.logo-preview img{max-width:100%;max-height:100%}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:12px 24px;border-radius:24px;z-index:2000;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px 20px;color:#666;font-size:16px}
.empty .big{font-size:60px;margin-bottom:10px;opacity:.5}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat-card{background:#fff;border:2px solid #81c784;border-radius:10px;padding:10px;text-align:center}
.stat-card .sn{font-size:13px;color:#558b2f}.stat-card .sv{font-size:18px;font-weight:bold;color:#1b5e20;margin-top:4px;direction:ltr;unicode-bidi:embed}
.stat-card.red .sv{color:#c62828}.stat-card.red{border-color:#ef9a9a}
.login-box{max-width:400px;margin:60px auto 20px;padding:24px;background:#fff;border:3px solid #43a047;border-radius:16px;box-shadow:0 8px 24px rgba(46,125,50,.2)}
.login-box h2{text-align:center;color:#2e7d32;margin-bottom:20px}
.pw-tog{position:absolute;left:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#66bb6a;font-size:20px}
.inv-view{background:#fff;border:2px solid #81c784;border-radius:12px;padding:12px;margin:10px 0;cursor:pointer}
.inv-view:active{background:#f1f8e9}
.hist-box{background:#fff8e1;border:2px solid #fbc02d;border-radius:10px;padding:10px;margin-top:6px;font-size:13px}
.hist-box b{color:#c62822}
.v{direction:ltr;unicode-bidi:embed;display:inline-block}
@media (max-width:380px){
  .tbl-head,.tbl-row{grid-template-columns:17% 17% 13% 12% 1fr 10%;font-size:12px}
  .tbl-row input{font-size:13px;padding:6px 2px}
  .menu-grid{grid-template-columns:1fr 1fr;gap:8px;padding:0 6px}
  .menu-item{padding:14px 6px;min-height:90px;font-size:15px}
  .menu-item .mi-ic{font-size:28px}
  .field input,.field select,.field textarea{font-size:16px}
  .btn{padding:10px 8px;font-size:15px}
}
</style>

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= FIREBASE (Realtime Database only - NO Storage) ================= */
const firebaseConfig={
  apiKey:"AIzaSyDq0rG5RjM4U6J4moCDyyRIyYfkdygyw40",
  authDomain:"track-accounts-and-invoices.firebaseapp.com",
  databaseURL:"https://track-accounts-and-invoices-default-rtdb.firebaseio.com",
  projectId:"track-accounts-and-invoices",
  storageBucket:"track-accounts-and-invoices.appspot.com",
  messagingSenderId:"5173557926",
  appId:"1:5173557926:web:cec722c13234731e7dd267"
};
firebase.initializeApp(firebaseConfig);
const DB=firebase.database();
const DEV_PHONE='963957869853';

/* ================= STATE ================= */
const State={
  user:null,page:'home',navStack:[],
  invoices:[],items:[],merchants:[],
  profile:{name:'',address:'',phone:'',logo:''},
  users:{admin:{pass:'admin123',name:'المدير العام'},admin1:{pass:'admin1234',name:'المستخدم الثاني'}},
  currentInvoice:null,listeners:{},
  _stockCache:null,_stockVer:0
};
const LS_KEY='inv_session_v6';

/* ================= UTILS ================= */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}
// English numbers with comma thousands separator (no Arabic-Indic digits - faster & clearer)
function fmt(n){
  n=Number(n||0);
  if(!isFinite(n))return '0';
  const s=Math.abs(n).toFixed(2).replace(/\.00$/,'');
  const [int,dec]=s.split('.');
  const intFmt=int.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (n<0?'-':'')+(dec?intFmt+'.'+dec:intFmt);
}
function today(){return new Date().toISOString().slice(0,10)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nextNo(){return State.invoices.length?Math.max(...State.invoices.map(i=>+i.no||0))+1:1}
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
function closeAll(){document.querySelectorAll('.mbg,.cmenu').forEach(e=>e.remove())}
function compressImage(file,max=450,q=0.6){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>max){w=Math.round(w*max/h);h=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=e.target.result};r.onerror=rej;r.readAsDataURL(file)})}

function goTo(page,pushStack){
  if(pushStack!==false&&State.page!==page)State.navStack.push(State.page);
  State.page=page;render();
}
function goBack(){
  if(State.page==='newInv'&&State.currentInvoice&&State.currentInvoice.items&&State.currentInvoice.items.length){
    if(!confirm('العودة؟ لن تُحفظ التغييرات'))return;
  }
  State.currentInvoice=null;
  if(State.navStack.length){State.page=State.navStack.pop()}
  else State.page='home';
  render();
}

/* ================= AUTH ================= */
function loginView(){
  document.getElementById('app').innerHTML=`
  <div class="header" style="justify-content:center">حفظ الفواتير والحسابات</div>
  <div class="login-box">
    <h2>تسجيل الدخول</h2>
    <div class="field"><label>اسم المستخدم</label><input id="li_u" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus></div>
    <div class="field" style="position:relative"><label>كلمة المرور</label>
      <input id="li_p" type="password" autocomplete="new-password">
      <span class="pw-tog" onclick="const x=document.getElementById('li_p');x.type=x.type==='password'?'text':'password'">👁</span>
    </div>
    <div style="margin:10px 0"><label style="font-size:14px;cursor:pointer"><input type="checkbox" id="li_rem"> تذكرني على هذا الجهاز</label></div>
    <button class="btn btn-green btn-full" onclick="doLogin()">دخول</button>
    <p style="margin-top:14px;text-align:center;color:#666;font-size:13px">للمشاكل: <a href="tel:+${DEV_PHONE}" style="color:#2e7d32;text-decoration:none">+${DEV_PHONE}</a></p>
  </div>`;
}
function doLogin(){
  const u=document.getElementById('li_u').value.trim();
  const p=document.getElementById('li_p').value;
  if(State.users[u]&&State.users[u].pass===p){
    State.user=u;
    if(document.getElementById('li_rem').checked)localStorage.setItem(LS_KEY,JSON.stringify({u,p}));
    else localStorage.removeItem(LS_KEY);
    loadData();
  }else toast('بيانات الدخول غير صحيحة');
}
function logout(){localStorage.removeItem(LS_KEY);State.user=null;State.navStack=[];loginView()}

/* ================= SYNC ================= */
function loadData(){
  ['invoices','items','merchants','profile','users'].forEach(k=>{
    if(State.listeners[k])return;
    DB.ref(k).on('value',snap=>{
      const v=snap.val();
      if(v===null){
        if(k==='invoices')State.invoices=[];
        else if(k==='items')State.items=[];
        else if(k==='merchants')State.merchants=[];
        else if(k==='profile')State.profile={name:'',address:'',phone:'',logo:''};
        else if(k==='users')State.users={admin:{pass:'admin123',name:'المدير العام'},admin1:{pass:'admin1234',name:'المستخدم الثاني'}};
      }else{
        if(k==='invoices')State.invoices=Object.entries(v).map(([id,o])=>({id,...o}));
        else if(k==='items')State.items=Object.entries(v).map(([id,o])=>({id,...o}));
        else if(k==='merchants')State.merchants=Object.entries(v).map(([id,o])=>({id,...o}));
        else if(k==='profile')State.profile=v;
        else if(k==='users')State.users=v;
      }
      State._stockCache=null;
      if(State.user)render();
    });
    State.listeners[k]=1;
  });
}
function saveFB(p,d){return DB.ref(p).set(d)}
function pushFB(p,d){return DB.ref(p).push(d).key}
function updFB(p,d){return DB.ref(p).update(d)}
function delFB(p){return DB.ref(p).remove()}

/* ================= STOCK (CACHED) ================= */
let _lpT=null;
function lpStart(i){_lpT=setTimeout(()=>{if(confirm('حذف صورة الصنف؟')){State.currentInvoice.items[i].image='';renderInvRows();toast('تم حذف الصورة')}},_lpT=600)}
function lpEnd(){clearTimeout(_lpT)}
function removeRowImg(e,i){e.preventDefault();if(confirm('حذف صورة الصنف؟')){State.currentInvoice.items[i].image='';renderInvRows();toast('تم حذف الصورة')}}

function recalcStock(){
  if(State._stockCache)return State._stockCache;
  const stock={};
  State.items.forEach(it=>{stock[(it.name||'').toLowerCase()]=+(it.openingStock||0)});
  State.invoices.forEach(inv=>{
    if(inv.isPayment)return;
    (inv.items||[]).forEach(it=>{
      const k=(it.name||'').toLowerCase();if(!k)return;
      if(!(k in stock))stock[k]=0;
      const q=+it.qty||0;
      const sign=inv.isReturn?-1:1;
      if(inv.type==='مورد')stock[k]+=sign*q; else stock[k]-=sign*q;
    });
  });
  State._stockCache=stock;
  return stock;
}
function stockOf(name){
  const s=recalcStock();
  return s[(name||'').toLowerCase()]||0;
}

/* ================= PRICE HISTORY ================= */
function priceHist(name){
  const lines=[];
  const lc=(name||'').toLowerCase();
  State.invoices.forEach(inv=>(inv.items||[]).forEach(it=>{
    if(it.name&&it.name.toLowerCase()===lc&&+it.price>0)
      lines.push({price:+it.price,date:inv.date,no:inv.no,merchant:inv.merchant,qty:+it.qty||0});
  }));
  return lines.sort((a,b)=>a.price-b.price);
}

/* ================= ROUTER ================= */
function render(){
  if(!State.user){loginView();return}
  const app=document.getElementById('app');
  let h='';
  switch(State.page){
    case 'home':h=homeView();State.navStack=[];break;
    case 'newInv':h=newInvView();break;
    case 'searchInv':h=searchInvView();break;
    case 'searchItem':h=searchItemView();break;
    case 'merchants':h=merchantsView();break;
    case 'items':h=itemsView();break;
    case 'balances':h=balancesView();break;
    case 'profile':h=profileView();break;
    case 'reports':h=reportsView();break;
    case 'settings':h=settingsView();break;
    default:h=homeView();State.navStack=[];
  }
  app.innerHTML=h;

function backupData(){
  const d={invoices:State.invoices,items:State.items,merchants:State.merchants,profile:State.profile};
  const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='backup_'+today()+'.json';a.click();URL.revokeObjectURL(u);toast('تم حفظ النسخة');
}
function restoreData(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{const f=e.target.files[0];const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);const o={};
    if(d.invoices)o.invoices=Object.fromEntries(d.invoices.map(x=>[x.id||uid(),x]));
    if(d.items)o.items=Object.fromEntries(d.items.map(x=>[x.id||uid(),x]));
    if(d.merchants)o.merchants=Object.fromEntries(d.merchants.map(x=>[x.id||uid(),x]));
    if(d.profile)o.profile=d.profile;
    DB.ref().update(o,()=>toast('تم الاسترجاع'))}catch(e){toast('ملف غير صالح')}};r.readAsText(f)};i.click();
}

/* merchant autocomplete */
function posAc(list,inp){
  if(!list||!inp)return;
  const r=inp.getBoundingClientRect();
  const w=Math.min(r.width,window.innerWidth-20);
  list.style.width=w+'px';
  list.style.right=Math.max(10,window.innerWidth-r.right)+'px';
  const sb=window.innerHeight-r.bottom,need=280;
  if(sb<need&&r.top>need){list.style.top='auto';list.style.bottom=(window.innerHeight-r.top+4)+'px';list.style.maxHeight=Math.min(280,r.top-20)+'px'}
  else{list.style.top=(r.bottom+4)+'px';list.style.bottom='auto';list.style.maxHeight=Math.min(280,Math.max(120,sb-10))+'px'}
}
function merchantAc(inp){
  const q=inp.value.trim().toLowerCase(),list=document.getElementById('ac_m');if(!list)return;
  if(!q){list.style.display='none';return}
  const fromM=State.merchants.filter(m=>m.name.toLowerCase().includes(q));
  const invN=[...new Set(State.invoices.map(i=>i.merchant).filter(n=>n&&n.toLowerCase().includes(q)))];
  let html=fromM.slice(0,8).map(m=>`<div class="aci" onclick="pickM(this,'${m.name.replace(/'/g,"\\'")}')">
    <span class="aci-name">${m.name}<br><span class="aci-info">${m.type} — رصيد: ${fmt(Math.abs(m.balance||0))} ${(m.balance||0)>0?'(علينا)':'(لنا)'}</span></span></div>`).join('');
  const extra=invN.filter(n=>!fromM.find(x=>x.name===n)).slice(0,6);
  html+=extra.map(n=>`<div class="aci" onclick="pickM(this,'${n.replace(/'/g,"\\'")}')"><span class="aci-name">${n} <span class="chip">من السجل</span></span></div>`).join('');
  if(!html)html='<div class="aci" style="color:#2e7d32;justify-content:center">✓ اسم جديد — سيُضاف تلقائياً عند الحفظ</div>';
  list.innerHTML=html;list.style.display='block';posAc(list,inp);
}
function pickM(el,name){
  const w=State.currentInvoice;w.merchant=name;
  document.getElementById('inv_m').value=name;document.getElementById('ac_m').style.display='none';
  const m=State.merchants.find(x=>x.name===name);
  if(m){w.type=m.type==='عميل'?'عميل (بيع)':'مورد (شراء)';render();return}
  const h=State.invoices.filter(i=>i.merchant===name);
  if(h.length)w.type=h[h.length-1].type.startsWith('عميل')?'عميل (بيع)':'مورد (شراء)';
  recalc();
}

  let html=cat.slice(0,10).map(it=>{

function renderInvRows(){
  const list=document.getElementById('items_list');if(!list)return;
  const w=State.currentInvoice;
  list.innerHTML=w.items.map((it,i)=>{
    const tot=(+it.qty||0)*(+it.price||0);it.total=tot;
    return `<div>
      <div class="tbl-row">

        ${it.image?`<img src="${it.image}" class="img-th" onclick="viewImg('${it.image.replace(/'/g,"\\'")}')" oncontextmenu="removeRowImg(event,${i})" ontouchstart="lpStart(${i})" ontouchend="lpEnd()" ontouchmove="lpEnd()">`:
          `<button class="img-ic" onclick="takeRowImg(${i})">📷</button>`}
        <div class="ac-wrap">
          <input id="n_${i}" class="nm" value="${it.name}" oninput="updCell(${i},'name',this.value);itemAc(this,${i})" onfocus="itemAc(this,${i})" placeholder="اسم الصنف...">
          <div class="ac-list" id="ac_i_${i}"></div>
        </div>
        <button class="x-btn" onclick="removeRow(${i})">×</button>
      </div>
      <div id="ph_${i}"></div>
    </div>`}).join('');
}
function recalc(){
  const w=State.currentInvoice;if(!w)return;
  w.total=w.items.reduce((s,it)=>s+(+it.qty||0)*(+it.price||0),0);
  const disc=w.total*(+w.discountPct||0)/100+(+w.discountAmt||0);
  w.netTotal=Math.max(0,w.total-disc);
  const isMaw=w.type.startsWith('مورد');
  const m=State.merchants.find(x=>x.name===w.merchant);
  w.prevBalance=m?(+m.balance||0):0;
  w.balance=w.prevBalance+(isMaw?w.netTotal:-w.netTotal)-(+w.paid||0);
  const a=id=>document.getElementById(id);
  if(a('t_tot'))a('t_tot').textContent=fmt(w.total);
  if(a('t_net'))a('t_net').textContent=fmt(w.netTotal);
  if(a('t_prev'))a('t_prev').textContent=fmt(w.prevBalance);
  if(a('t_bal'))a('t_bal').textContent=fmt(Math.abs(w.balance));
}

function finishAddII(img){
  const name=document.getElementById('ni_n').value.trim();
  const price=+document.getElementById('ni_p').value||0;

  if(!name){toast('اكتب اسم الصنف');return}
  const ex=State.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!ex){const iid=pushFB('items',{});saveFB('items/'+iid,{id:iid,name,price,image:img,openingStock:0,createdAt:Date.now()})}
  else updFB('items/'+ex.id,{price,image:img});

function saveInv(){
  const w=State.currentInvoice;
  // Read merchant directly from input to ensure we have the latest typed value
  const merchInput=document.getElementById('inv_m');
  if(merchInput)w.merchant=merchInput.value.trim();
  if(!w.merchant){toast('اكتب اسم التاجر');return}
  if(!w.items.length){toast('اضف صنفاً واحداً على الاقل');return}
  w.items.forEach(it=>{if(!it.total)it.total=(+it.qty||0)*(+it.price||0)});
  recalc();
  w.type=w.type.startsWith('مورد')?'مورد':'عميل';
  if(!('isReturn' in w))w.isReturn=0;
  w.createdBy=State.user;w.createdAt=Date.now();
  const tasks=[];
  let m=State.merchants.find(x=>x.name===w.merchant);
  if(!m){const mid=pushFB('merchants',{});m={id:mid,name:w.merchant,type:w.type,phone:'',balance:0};tasks.push(saveFB('merchants/'+mid,m))}
  else tasks.push(saveFB('merchants/'+m.id+'/type',w.type));
  let id;if(w.id){id=w.id;tasks.push(saveFB('invoices/'+id,w))}
  else{id=pushFB('invoices',{});w.id=id;w.no=nextNo();tasks.push(saveFB('invoices/'+id,w))}
  w.items.forEach(it=>{
    if(!it.name)return;
    const ex=State.items.find(x=>x.name.toLowerCase()===it.name.toLowerCase());
    const data={name:it.name,price:+it.price||0};if(it.image)data.image=it.image;
    if(!ex){const iid=pushFB('items',{});data.id=iid;data.openingStock=0;data.createdAt=Date.now();tasks.push(saveFB('items/'+iid,data))}
    else tasks.push(updFB('items/'+ex.id,data));
  });
  Promise.all(tasks).then(()=>{
    recalcMbal(w.merchant,w);
    toast('✅ تم حفظ الفاتورة رقم '+w.no);
    State._stockCache=null;
    State.currentInvoice={id:null,no:null,date:today(),type:'مورد (شراء)',merchant:'',payment:'آجل',paid:0,discountPct:0,discountAmt:0,items:[],total:0,netTotal:0,balance:0,prevBalance:0,note:'',isReturn:0};
    setTimeout(()=>{State.currentInvoice.no=nextNo();render()},400);
  }).catch(e=>toast('خطأ: '+e.message));
}
function recalcMbal(name,extra){
  let invs=State.invoices.filter(i=>i.merchant===name&&i.id!==(extra&&extra.id));
  if(extra)invs.push(extra);
  let bal=0;invs.forEach(i=>{const s=i.type==='مورد'?1:-1;bal+=s*(i.netTotal||0);bal-=(i.paid||0)});
  const m=State.merchants.find(x=>x.name===name);if(m)saveFB('merchants/'+m.id+'/balance',bal);
}

async function searchInvByImg(e){
  const f=e.target.files[0];if(!f)return;toast('جاري البحث...');
  const d=await compressImage(f,300,0.6);const th=await cHist(d);
  let best=null,bs=0;
  for(const it of State.items){if(!it.image)continue;try{const h=await cHist(it.image);const s=hInt(th,h);if(s>bs){bs=s;best=it}}catch(e){}}
  if(best&&bs>0.05){document.getElementById('sf_item').value=best.name;runSearchInv();toast('تم التعرف: '+best.name+' ('+Math.round(bs*100)+'%)')}
  else toast('لا يوجد تطابق');e.target.value='';
}
function iHist(d){const h=new Float32Array(64);for(let i=0;i<d.length;i+=4){const r=d[i]>>6,g=d[i+1]>>6,b=d[i+2]>>6;h[r*16+g*4+b]++}const t=d.length/4;for(let i=0;i<h.length;i++)h[i]/=t;return h}
function cHist(u){return new Promise(res=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>{const c=document.createElement('canvas');c.width=24;c.height=24;const x=c.getContext('2d');x.drawImage(i,0,0,24,24);try{res(iHist(x.getImageData(0,0,24,24).data))}catch(e){res(new Float32Array(64))}};i.onerror=()=>res(new Float32Array(64));i.src=u})}
function hInt(a,b){let s=0;for(let i=0;i<a.length;i++)s+=Math.min(a[i],b[i]);return s}

function doPay(id,type){

function renderItems(){
  const q=(document.getElementById('it_q')?.value||'').trim().toLowerCase();
  let list=State.items.slice();
  if(q)list=list.filter(i=>(i.name||'').toLowerCase().includes(q));
  list.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
  const stock=recalcStock();
  let totVal=0;list.forEach(it=>{totVal+=(stock[(it.name||'').toLowerCase()]||0)*(it.price||0)});
  const s=document.getElementById('it_stock');if(s)s.innerHTML=`<div class="stat-grid"><div class="stat-card"><div class="sn">عدد الاصناف</div><div class="sv">${list.length}</div></div><div class="stat-card"><div class="sn">قيمة المخزون</div><div class="sv">${fmt(totVal)}</div></div></div>`;
  const g=document.getElementById('it_grid');if(!g)return;
  if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="big">📦</div>لا توجد اصناف — اضف اول صنف او انشئ فاتورة</div>';return}
  g.innerHTML=list.map(it=>{const st=stock[(it.name||'').toLowerCase()]||0;const ph=priceHist(it.name);const mn=ph.length?ph[0].price:0;
    return `<div class="pcard" onclick="editItem('${it.id}')">
      ${it.image?`<img src="${it.image}"/>`:`<div class="ph">📦</div>`}
      <div class="pn">${it.name}</div><div class="pp">السعر: ${fmt(it.price)}</div>
      <div class="pst ${st<0?'low':''}">مخزون: ${fmt(st)}${mn?` • اقل: ${fmt(mn)}`:''}</div>
    </div>`}).join('');
}
async function searchItemImg(e){
  const f=e.target.files[0];if(!f)return;toast('جاري البحث...');
  const d=await compressImage(f,300,0.6);const th=await cHist(d);
  const sc=[];for(const it of State.items){if(!it.image)continue;try{sc.push({it,s:hInt(th,await cHist(it.image))})}catch(e){}}
  sc.sort((a,b)=>b.s-a.s);const top=sc.filter(r=>r.s>0.05).slice(0,30);
  document.getElementById('it_q').value='';
  const g=document.getElementById('it_grid');
  if(!top.length){renderItems();toast('لا يوجد تطابق');e.target.value='';return}
  g.innerHTML=top.map(r=>{const st=stockOf(r.it.name);
    return `<div class="pcard" onclick="editItem('${r.it.id}')"><img src="${r.it.image}"><div class="pn">${r.it.name}</div><div class="pp">${fmt(r.it.price)} — ${Math.round(r.s*100)}%</div><div class="pst ${st<0?'low':''}">مخزون: ${fmt(st)}</div></div>`}).join('');
  toast('تم عرض النتائج');e.target.value='';
}

function reportsView(){

function runRep(){
  const t=document.getElementById('rp_t').value,f=document.getElementById('rp_f').value,to=document.getElementById('rp_t2').value;
  const ty=t==='مبيعات'?'عميل':'مورد';
  const invs=State.invoices.filter(i=>i.type===ty&&!i.isPayment&&i.date>=f&&i.date<=to);
  const it={};invs.forEach(i=>(i.items||[]).forEach(x=>{if(!it[x.name])it[x.name]={name:x.name,qty:0,total:0,price:x.price};const q=+x.qty||0,p=+x.price||0;it[x.name].qty+=q;it[x.name].total+=q*p}));
  const arr=Object.values(it).sort((a,b)=>b.total-a.total);
  const tot=arr.reduce((s,x)=>s+x.total,0),pd=invs.reduce((s,i)=>s+(+i.paid||0),0),dc=invs.reduce((s,i)=>s+i.total*(i.discountPct||0)/100+(+i.discountAmt||0),0);
  document.getElementById('rp_o').innerHTML=`<div class="card"><table><thead><tr><th>اجمالي</th><th>سعر</th><th>كمية</th><th>الصنف</th><th>م</th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td class="v">${fmt(x.total)}</td><td class="v">${fmt(x.price)}</td><td class="v">${fmt(x.qty)}</td><td>${x.name}</td><td>${i+1}</td></tr>`).join('')}</tbody></table>
  <table><tbody><tr><td class="v">${fmt(tot)}</td><td>اجمالي الفواتير</td></tr><tr><td class="v">${invs.length}</td><td>عدد الفواتير</td></tr><tr><td class="v">${fmt(dc)}</td><td>الخصم</td></tr><tr><td class="v">${fmt(tot-dc)}</td><td>الصافي</td></tr><tr><td class="v">${fmt(pd)}</td><td>المدفوع</td></tr><tr><td class="v">${fmt(tot-dc-pd)}</td><td>الآجل</td></tr></tbody></table></div>`;
}
function pdfRep(){runRep();const o=document.getElementById('rp_o').innerHTML;const w=window.open('','_blank');w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><style>body{font-family:Tahoma;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #333;padding:6px;text-align:center}</style></head><body><h2 style="text-align:center">تقرير</h2>${o}<button onclick="window.print()">طباعة</button></body></html>`);w.document.close()}
function shareRep(){runRep();const t=document.getElementById('rp_o').innerText;const ph=prompt('رقم واتساب:','+963');if(!ph)return;const n=ph.replace(/\D/g,'');window.open(`https://wa.me/${n}?text=${encodeURIComponent(t)}`)}

function settingsView(){
  const h=`
  <div class="header"><button class="h-btn" onclick="hdrMenu(event,'other')">⋮</button><span>الإعدادات</span><button class="h-btn" onclick="hdrBack()">→</button></div>
  <div class="wrap">
    <h3 style="color:#2e7d32;margin-bottom:10px">المستخدمون</h3>
    <div id="us_list"></div>
    <button class="btn-big-green" onclick="editUser(null)">➕ اضافة مستخدم جديد</button>
    <h3 style="color:#2e7d32;margin-top:20px">النسخ الاحتياطي</h3>
    <button class="btn btn-blue btn-full" style="margin:6px 0" onclick="backupData()">💾 حفظ نسخة احتياطية</button>
    <label class="btn btn-gray btn-full" style="margin:6px 0">📂 استرجاع نسخة<input type="file" accept=".json" style="display:none" onchange="restoreFile(event)"></label>
    <button class="btn btn-red btn-full" style="margin:6px 0" onclick="logout()">🚪 تسجيل الخروج</button>
    <h3 style="color:#2e7d32;margin-top:20px">تواصل مع المطور</h3>
    <a href="tel:+${DEV_PHONE}" class="btn btn-green btn-full" style="text-decoration:none;margin:6px 0">📞 ${DEV_PHONE}</a>
    <a href="https://wa.me/${DEV_PHONE}" class="btn btn-whats btn-full" style="text-decoration:none;margin:6px 0" target="_blank">💬 واتساب المطور</a>
  </div>`;
  setTimeout(renderUsers,50);
  return h;
}
function renderUsers(){
  const el=document.getElementById('us_list');if(!el)return;
  el.innerHTML=Object.entries(State.users).map(([u,d])=>`<div class="mcard" onclick="editUser('${u}')"><div><div class="mn">${u}</div><div class="mt">${d.name||''}</div></div><div class="mb has">تعديل</div></div>`).join('');
}
function editUser(u){
  closeAll();
  const d=u?State.users[u]:{name:'',pass:''};
  const bg=el(`<div class="mbg" onclick="if(event.target===this)closeAll()"><div class="mdl"><h3>${u?'تعديل مستخدم':'مستخدم جديد'}</h3>
    <div class="field"><label>اسم المستخدم</label><input id="eu_u" value="${u||''}" ${u?'readonly':''}></div>
    <div class="field"><label>الاسم الظاهر</label><input id="eu_n" value="${d.name||''}"></div>
    <div class="field"><label>كلمة المرور</label><input id="eu_p" value="${d.pass||''}"></div>
    <div class="row">
      ${u&&u!=='admin'?`<button class="btn btn-red" onclick="delUser('${u}')">حذف</button>`:''}
      <button class="btn btn-gray" onclick="closeAll()">الغاء</button>
      <button class="btn btn-green" onclick="saveUser('${u||''}')">حفظ</button>
    </div>
  </div></div>`);
  document.body.appendChild(bg);
}
function saveUser(u){
  const un=u||document.getElementById('eu_u').value.trim(),nm=document.getElementById('eu_n').value.trim(),pw=document.getElementById('eu_p').value;
  if(!un||!pw){toast('اكمل البيانات');return}
  saveFB('users',{...State.users,[un]:{name:nm||un,pass:pw}}).then(()=>{closeAll();toast('تم الحفظ');render()});
}
function delUser(u){if(confirm('حذف المستخدم؟')){const us={...State.users};delete us[u];saveFB('users',us).then(()=>{closeAll();render()})}}
function restoreFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);const o={};if(d.invoices)o.invoices=Object.fromEntries(d.invoices.map(i=>[i.id||uid(),i]));if(d.items)o.items=Object.fromEntries(d.items.map(i=>[i.id||uid(),i]));if(d.merchants)o.merchants=Object.fromEntries(d.merchants.map(m=>[m.id||uid(),m]));if(d.profile)o.profile=d.profile;DB.ref().update(o,()=>toast('تم الاسترجاع'))}catch(e){toast('ملف غير صالح')}};r.readAsText(f)}

/* ================= INIT ================= */
document.addEventListener('click',e=>{
  if(!e.target.closest('.ac-wrap')&&!e.target.closest('.cmenu'))document.querySelectorAll('.ac-list').forEach(l=>l.style.display='none');
});
window.addEventListener('scroll',()=>document.querySelectorAll('.ac-list').forEach(l=>l.style.display='none'),true);
window.addEventListener('resize',()=>document.querySelectorAll('.ac-list').forEach(l=>l.style.display='none'));
// auto-login if remembered
(function(){
  const s=localStorage.getItem(LS_KEY);
  if(s)try{
    const p=JSON.parse(s);
    if(State.users[p.u]&&State.users[p.u].pass===p.p){State.user=p.u;loadData();return}
  }catch(e){}
  loginView();
})();
</script>
</body>
</html>
